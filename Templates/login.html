<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Аналитика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/analytics.css">
</head>
<body class="min-h-screen flex items-center justify-center" style="background: #f8f9fa;">
    <div class="w-full max-w-md px-6">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style="background: rgba(227, 6, 19, 0.1);">
                <svg class="w-8 h-8" style="color: #e30613;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold" style="color: #1f2937;">Веб-аналитика</h1>
            <p class="mt-2 text-sm" style="color: #6b7280;">Войдите в свой аккаунт</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <div class="card">
            <form method="POST" action="/login" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium mb-1.5" style="color: #374151;">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2.5 rounded-lg border text-sm focus:outline-none focus:ring-2 transition-colors"
                           style="border-color: #d1d5db; color: #1f2937; background: #f9fafb;"
                           onfocus="this.style.borderColor='#e30613'; this.style.boxShadow='0 0 0 3px rgba(227,6,19,0.1)'"
                           onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none'"
                           placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium mb-1.5" style="color: #374151;">Пароль</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2.5 rounded-lg border text-sm focus:outline-none focus:ring-2 transition-colors"
                           style="border-color: #d1d5db; color: #1f2937; background: #f9fafb;"
                           onfocus="this.style.borderColor='#e30613'; this.style.boxShadow='0 0 0 3px rgba(227,6,19,0.1)'"
                           onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none'"
                           placeholder="••••••••">
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-lg text-white font-medium text-sm transition-all hover:opacity-90"
                        style="background: #e30613;">
                    Войти
                </button>
            </form>
        </div>

        <!-- Register link -->
        <p class="text-center mt-6 text-sm" style="color: #6b7280;">
            Нет аккаунта?
            <a href="/register" class="font-medium hover:underline" style="color: #e30613;">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
